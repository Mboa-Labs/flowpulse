# Site nginx de FlowPulse sur le serveur hôte (à copier dans /etc/nginx/sites-available/).
# Remplacer DOMAINE par le nom de domaine, puis lancer certbot : il ajoute lui-même le bloc HTTPS
# et la redirection HTTP → HTTPS (docs/DEPLOIEMENT_VPS.md, étape 5).

server {
    listen 80;
    listen [::]:80;
    server_name DOMAINE;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Le superviseur peut réfléchir plus d'une minute (modèle de langage sans carte graphique)
        proxy_read_timeout 300s;
    }
}
