name: flowpulse

# Les dépôts flowpulse-* doivent être clonés côte à côte (voir README).
# Par défaut, Ollama tourne directement sur la machine hôte (sur Mac, il utilise alors la puce
# graphique Apple). Sur un serveur Linux sans Ollama installé : docker compose --profile ollama up -d
# et OLLAMA_URL=http://ollama:11434 dans le .env.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: flowpulse
      POSTGRES_USER: ${DB_USER:-flowpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    # Accessible depuis la machine seulement, pour lancer le backend hors Docker (15432 : évite les PostgreSQL déjà installés sur 5432 et suivants)
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowpulse} -d flowpulse"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ai-service:
    build: ../flowpulse-ai-service
    environment:
      FLOWPULSE_OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      FLOWPULSE_LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      FLOWPULSE_CHROMA_DIR: /kb/chroma
      FLOWPULSE_BACKEND_URL: http://backend:8080
      FLOWPULSE_DATABASE_URL: postgresql://${DB_USER:-flowpulse}:${DB_PASSWORD:-flowpulse}@postgres:5432/flowpulse
    volumes:
      - ../flowpulse-knowledge-base:/kb
      # Sorties du pipeline D4D (séries, zones, modèles), si elles ont été produites ; sinon données de démonstration
      - ../flowpulse-ai-service/pipeline/sortie:/app/pipeline/sortie:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ../flowpulse-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flowpulse
      DB_USER: ${DB_USER:-flowpulse}
      DB_PASSWORD: ${DB_PASSWORD:-flowpulse}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-0123456789}
      AI_SERVICE_URL: http://ai-service:8000
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@flowpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_USERS: ${DEMO_USERS:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      # Origines autorisées en plus de la page elle-même (motifs acceptés, séparés par des virgules)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Seul point d'entrée exposé : l'interface et son proxy /api vers le backend
  frontend:
    build: ../flowpulse-frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
