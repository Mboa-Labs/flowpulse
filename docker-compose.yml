name: flowpulse

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flowpulse
      POSTGRES_USER: ${DB_USER:-flowpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flowpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-flowpulse} -d flowpulse"]
      interval: 5s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # GPU NVIDIA : décommenter si disponible
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ai-service:
    build: ../flowpulse-ai-service
    environment:
      FLOWPULSE_OLLAMA_URL: http://ollama:11434
      FLOWPULSE_CHROMA_DIR: /kb/chroma
      FLOWPULSE_BACKEND_URL: http://backend:8080
    volumes:
      - ../flowpulse-knowledge-base:/kb
    depends_on:
      - ollama
    ports:
      - "8000:8000"

  backend:
    build: ../flowpulse-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flowpulse
      DB_USER: ${DB_USER:-flowpulse}
      DB_PASSWORD: ${DB_PASSWORD:-flowpulse}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-dev-only-change-me-0123456789}
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: http://localhost:8081
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@flowpulse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ../flowpulse-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
  ollama:
