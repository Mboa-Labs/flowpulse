# Réglages de production, ajoutés à docker-compose.yml sur un serveur partagé (VPS).
# Activés par COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml dans le .env (voir scripts/serveur.sh).
#
# - Limites de mémoire et de processeur : FlowPulse ne peut jamais prendre la place des autres applications.
# - Rien n'est ouvert sur Internet : l'interface écoute sur 127.0.0.1, nginx de l'hôte sert le HTTPS.
# - Journaux plafonnés, contrôles de santé, redémarrage automatique.

x-journaux: &journaux
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *journaux
    ports: !reset []  # la base n'est joignable que par les autres conteneurs
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }

  ollama:
    <<: *journaux
    environment:
      OLLAMA_NUM_PARALLEL: "1"  # une question à la fois : mémoire stable
      OLLAMA_MAX_LOADED_MODELS: "2"  # modèle de langage + modèle d'embeddings
      OLLAMA_KEEP_ALIVE: "30m"
    deploy:
      resources:
        limits: { memory: 4g, cpus: "3" }

  ai-service:
    <<: *journaux
    environment:
      # Autant de fils que de cœurs accordés à Ollama (3) : sinon il en lance 6 et s'étrangle sous la limite
      FLOWPULSE_LLM_THREADS: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/horloge', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits: { memory: 1536m, cpus: "1.5" }

  backend:
    <<: *journaux
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits: { memory: 768m, cpus: "1" }

  frontend:
    <<: *journaux
    ports: !override
      - "127.0.0.1:${APP_PORT:-8095}:80"
    deploy:
      resources:
        limits: { memory: 128m, cpus: "0.5" }
